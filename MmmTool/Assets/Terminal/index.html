<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <!-- 自分のフォルダーのファイルだけを読み込む。外部への通信・フレーム・フォームを禁止する（xterm.js が <style> を足すため、style だけ inline を許可） -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'" />
    <link rel="stylesheet" href="xterm.css" />
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #0c0c0c;
        }

        #terminal {
            position: absolute;
            inset: 6px 0 0 8px;
        }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <script src="xterm.js"></script>
    <script src="addon-fit.js"></script>
    <script src="terminal.js"></script>
</body>
</html>
